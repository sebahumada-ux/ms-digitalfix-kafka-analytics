server:
  port: 8091

spring:
  application:
    name: ms-digitalfix-kafka-analytics

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:19093,localhost:19094}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 5

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest

    listener:
      ack-mode: record
      concurrency: 3

app:
  kafka:
    topics:
      workorders: digitalfix.ordenes.eventos
      analytics: digitalfix.analitica.eventos

    groups:
      workorders: digitalfix-analytics-workorders
      analytics: digitalfix-analytics-metrics

management:
  endpoints:
    web:
      exposure:
        include: health,info